<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .status {
            text-align: center;
            font-size: 1.2em;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 10px;
            background: #f0f0f0;
        }

        .status.black {
            background: #333;
            color: white;
        }

        .status.white {
            background: #fff;
            color: #333;
            border: 2px solid #333;
        }

        .status.winner {
            background: #4caf50;
            color: white;
            font-size: 1.5em;
            animation: pulse 0.5s ease-in-out infinite alternate;
        }

        .status.draw {
            background: #ff9800;
            color: white;
            font-size: 1.3em;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .board-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            overflow: auto;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(15, 30px);
            grid-template-rows: repeat(15, 30px);
            background: #dcb35c;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .cell {
            width: 30px;
            height: 30px;
            position: relative;
            cursor: pointer;
        }

        .cell::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #8b6914;
        }

        .cell::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: #8b6914;
        }

        .cell.black::before,
        .cell.black::after,
        .cell.white::before,
        .cell.white::after {
            display: none;
        }

        /* 最后落子高亮 */
        .cell.last-move::after {
            content: '';
            display: block;
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ff4444;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            box-shadow: 0 0 4px rgba(255, 68, 68, 0.8);
        }

        .cell.last-move .piece::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border: 2px solid #ff4444;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .piece {
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        .piece.black {
            background: radial-gradient(circle at 30% 30%, #555, #000);
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .piece.white {
            background: radial-gradient(circle at 30% 30%, #fff, #ddd);
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .cell:hover:not(.black):not(.white) {
            background: rgba(255, 255, 255, 0.3);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .restart-btn {
            background: #667eea;
            color: white;
        }

        .restart-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .undo-btn {
            background: #f093fb;
            color: white;
        }

        .undo-btn:hover {
            background: #e080eb;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 147, 251, 0.4);
        }

        .history {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 0.9em;
        }

        /* 确认弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-family: inherit;
        }

        .modal-btn.confirm {
            background: #667eea;
            color: white;
        }

        .modal-btn.cancel {
            background: #ccc;
            color: #333;
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .game-container {
                padding: 15px;
            }

            h1 {
                font-size: 1.5em;
            }

            .board {
                grid-template-columns: repeat(15, 20px);
                grid-template-rows: repeat(15, 20px);
                padding: 10px;
            }

            .cell {
                width: 20px;
                height: 20px;
            }

            .piece {
                width: 18px;
                height: 18px;
            }

            button {
                padding: 10px 20px;
                font-size: 1em;
            }
        }

        @media (max-width: 400px) {
            .board {
                grid-template-columns: repeat(15, 18px);
                grid-template-rows: repeat(15, 18px);
                padding: 8px;
            }

            .cell {
                width: 18px;
                height: 18px;
            }

            .piece {
                width: 16px;
                height: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>五子棋</h1>
        <div class="status black" id="status">黑方回合</div>
        <div class="board-wrapper">
            <div class="board" id="board"></div>
        </div>
        <div class="controls">
            <button class="restart-btn" onclick="showRestartConfirm()">重新开始</button>
            <button class="undo-btn" onclick="undoMove()">悔棋</button>
        </div>
        <div class="history" id="history">落子数: 0</div>
    </div>

    <!-- 确认弹窗 -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h3>确定要重新开始吗？</h3>
            <p style="color: #666; margin-bottom: 20px;">当前棋局将丢失</p>
            <div class="modal-buttons">
                <button class="modal-btn confirm" onclick="confirmRestart()">确定</button>
                <button class="modal-btn cancel" onclick="hideRestartConfirm()">取消</button>
            </div>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 15;
        let currentPlayer = 'black';
        let board = [];
        let gameOver = false;
        let moveHistory = [];
        let lastMove = null;

        function initBoard() {
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            moveHistory = [];
            gameOver = false;
            currentPlayer = 'black';
            lastMove = null;
            updateStatus();
            renderBoard();
            updateHistory();
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;

                    // 标记最后落子位置
                    if (lastMove && lastMove.row === row && lastMove.col === col) {
                        cell.classList.add('last-move');
                    }

                    if (board[row][col]) {
                        cell.classList.add(board[row][col]);
                        const piece = document.createElement('div');
                        piece.className = `piece ${board[row][col]}`;
                        cell.appendChild(piece);
                    }

                    cell.addEventListener('click', () => handleClick(row, col));
                    boardEl.appendChild(cell);
                }
            }
        }

        function handleClick(row, col) {
            if (gameOver || board[row][col]) return;

            board[row][col] = currentPlayer;
            lastMove = { row, col, player: currentPlayer };
            moveHistory.push(lastMove);

            if (checkWin(row, col)) {
                gameOver = true;
                renderBoard();
                const winner = currentPlayer === 'black' ? '黑方' : '白方';
                document.getElementById('status').textContent = `${winner}获胜！`;
                document.getElementById('status').className = 'status winner';
                return;
            }

            // 检查平局
            if (checkDraw()) {
                gameOver = true;
                renderBoard();
                document.getElementById('status').textContent = '平局！';
                document.getElementById('status').className = 'status draw';
                return;
            }

            currentPlayer = currentPlayer === 'black' ? 'white' : 'black';
            updateStatus();
            renderBoard();
            updateHistory();
        }

        function checkWin(row, col) {
            const directions = [
                [[0, 1], [0, -1]],   // 水平
                [[1, 0], [-1, 0]],   // 垂直
                [[1, 1], [-1, -1]], // 主对角线
                [[1, -1], [-1, 1]]  // 副对角线
            ];

            const player = board[row][col];

            for (const [dir1, dir2] of directions) {
                let count = 1;

                for (const [dr, dc] of [dir1, dir2]) {
                    let r = row + dr;
                    let c = col + dc;
                    while (
                        r >= 0 && r < BOARD_SIZE &&
                        c >= 0 && c < BOARD_SIZE &&
                        board[r][c] === player
                    ) {
                        count++;
                        r += dr;
                        c += dc;
                    }
                }

                if (count >= 5) return true;
            }

            return false;
        }

        // 检查平局
        function checkDraw() {
            return moveHistory.length === BOARD_SIZE * BOARD_SIZE;
        }

        function updateStatus() {
            const statusEl = document.getElementById('status');
            if (!gameOver) {
                statusEl.textContent = currentPlayer === 'black' ? '黑方回合' : '白方回合';
                statusEl.className = `status ${currentPlayer}`;
            }
        }

        function updateHistory() {
            document.getElementById('history').textContent = `落子数: ${moveHistory.length}`;
        }

        // 显示重新开始确认弹窗
        function showRestartConfirm() {
            document.getElementById('confirmModal').classList.add('show');
        }

        // 隐藏重新开始确认弹窗
        function hideRestartConfirm() {
            document.getElementById('confirmModal').classList.remove('show');
        }

        // 确认重新开始
        function confirmRestart() {
            hideRestartConfirm();
            initBoard();
        }

        // 悔棋 - 现在允许游戏结束后悔棋
        function undoMove() {
            if (moveHistory.length === 0) return;

            const lastMoveData = moveHistory.pop();
            board[lastMoveData.row][lastMoveData.col] = null;

            // 更新最后落子位置
            if (moveHistory.length > 0) {
                lastMove = moveHistory[moveHistory.length - 1];
            } else {
                lastMove = null;
            }

            // 如果游戏已结束，悔棋后恢复游戏状态
            if (gameOver) {
                gameOver = false;
            }

            currentPlayer = lastMoveData.player;
            updateStatus();
            renderBoard();
            updateHistory();
        }

        // 初始化游戏
        initBoard();
    </script>
</body>
</html>
